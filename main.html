<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="img/logo.png" />
</head>
<body class="radio" itemscope itemtype="http://schema.org/WebPage">

  <div id="topbar"><img id="topbar-logo" src="img/logo.png" alt="RadioLofi logo" />RadioLofi</div>

  <div id="main" itemprop="mainContentOfPage">

    <div id="content">

      <div id="player" itemprop="mainEntity" itemscope itemtype="http://schema.org/MusicPlaylist">

        <div id="player-cover" itemprop="image">
          <span></span>
        </div>

        <div id="player-title" itemprop="name"></div>

        <div id="player-controls">
          <button class="ctrl-btn" id="btn-shuffle" onclick="toggleShuffle()" title="Shuffle">&#x21C4;</button>
          <button class="ctrl-btn" onclick="prevSong()" title="Anterior">&#x23EE;</button>
          <button class="ctrl-btn" id="btn-play" onclick="togglePlay()" title="Play/Pausa">&#x25B6;</button>
          <button class="ctrl-btn" onclick="nextSong()" title="Següent">&#x23ED;</button>
          <button class="ctrl-btn" id="btn-repeat" onclick="repeatSong()" title="Repetir">&#x21BA;</button>
        </div>

        <input id="progress" type="range" min="0" max="100" value="0" oninput="seek(this)" />

        <div id="volume-control">
          <span id="volume-icon">&#x25B2;&#x25B2;&#x25B2;</span>
          <input id="volume" type="range" min="0" max="100" value="80" oninput="setVolume(this)" />
        </div>

      </div>

    </div>

    <div id="sidebar">
      <nav>
        <a href="index.html">Index</a>
        <a href="main.html" class="active">Radio</a>
        <a href="contact.html">Contactens</a>
        <a href="about.html">Sobre Nosaltres</a>
      </nav>
    </div>

  </div>

  <audio id="audio" preload="auto"></audio>

  <script>
    // ── Gradient per artista ──
    function randomGradient() {
      function rc() { return Math.floor(Math.random() * 200 + 55); }
      var angle = Math.floor(Math.random() * 360);
      var c1 = 'rgba('+rc()+','+rc()+','+rc()+',0.75)';
      var c2 = 'rgba('+rc()+','+rc()+','+rc()+',0.75)';
      var c3 = 'rgba('+rc()+','+rc()+','+rc()+',0.75)';
      return 'linear-gradient('+angle+'deg, '+c1+', '+c2+', '+c3+')';
    }

    var artistGradients = {};
    function gradientForArtist(label) {
      if (!artistGradients[label]) {
        artistGradients[label] = randomGradient();
      }
      return artistGradients[label];
    }

    // ── Playlist ── afegeix aquí les teves cançons
    var playlist = [
      { src: "mp3/Hopeless_Romantic.mp3",       title: "Hopeless Romantic",   label: "BOYWITHUKE"  },
      { src: "mp3/Overthinking.mp3",             title: "Overthinking",        label: "BOYWITHUKE"  },
      { src: "mp3/Affection.mp3",                title: "Affection",           label: "BOYWITHUKE"  },
      { src: "mp3/Cant_Let_You_Go.mp3",          title: "Can't Let You Go",    label: "BOYWITHUKE"  },
      { src: "mp3/Dear_Hollywood.mp3",           title: "Dear Hollywood",      label: "BOYWITHUKE"  },
      { src: "mp3/Enigma.mp3",                   title: "Enigma",              label: "BOYWITHUKE"  },
      { src: "mp3/Next_Best_Thing.mp3",          title: "Next Best Thing",     label: "BOYWITHUKE"  },
      { src: "mp3/Runaway.mp3",                  title: "Runaway",             label: "BOYWITHUKE"  },
      { src: "mp3/Terrified.mp3",                title: "Terrified",           label: "BOYWITHUKE"  },
      { src: "mp3/Impostor_Syndrome.mp3",        title: "Impostor Syndrome",   label: "Sidney Gish "  },
      { src: "mp3/Jane.mp3",                     title: "Jane",                label: "The Long Faces"  },
      { src: "mp3/propose.mp3",                  title: "Propose",             label: "Natori"      },
      { src: "mp3/beabadoobee_Glue_Song.mp3",    title: "The Glue Song",       label: "Beabadoobee" },
      { src: "mp3/beabadoobee_Real_Man.mp3",     title: "Real Man",            label: "Beabadoobee" },
      { src: "mp3/Eminem_Mockingbird.mp3",       title: "Mockingbird",         label: "Eminem"      },
      { src: "mp3/Eminem_Stan.mp3",              title: "Stan",                label: "Eminem"      },
      { src: "mp3/Laufey_From_The_Start.mp3",    title: "From The Start",      label: "Laufey"      },
      { src: "mp3/overtonight_mirrors_demo.mp3", title: "Mirrors (Demo)",      label: "Overtonight" },
      // { src: "mp3/nova_canco.mp3", title: "Títol", label: "ARTISTA" },
    ].map(function(s) { s.gradient = gradientForArtist(s.label); return s; });

    var userSongs = JSON.parse(sessionStorage.getItem('userSongs') || '[]');

    function openSongDB() {
      return new Promise(function (resolve, reject) {
        var request = window.indexedDB.open('RadioLofiSongs', 1);
        request.onupgradeneeded = function (event) {
          var db = event.target.result;
          if (!db.objectStoreNames.contains('songs')) {
            db.createObjectStore('songs');
          }
        };
        request.onsuccess = function (event) {
          resolve(event.target.result);
        };
        request.onerror = function (event) {
          reject(event.target.error);
        };
      });
    }

    function getSongBlob(key) {
      return openSongDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction('songs', 'readonly');
          var store = tx.objectStore('songs');
          var request = store.get(key);
          request.onsuccess = function () { resolve(request.result); };
          request.onerror = function (event) { reject(event.target.error); };
        });
      });
    }

    function restoreSong(song) {
      if (!song || !song.src || song.src.indexOf('mp3/') === 0 || song.src.indexOf('blob:') === 0) {
        return Promise.resolve(song);
      }
      return getSongBlob(song.src).then(function (blob) {
        if (blob) {
          song.src = URL.createObjectURL(blob);
        }
        return song;
      }).catch(function () {
        return song;
      });
    }

    function initPlaylist() {
      return Promise.all(userSongs.map(restoreSong)).then(function (restored) {
        playlist = playlist.concat(restored.map(function(s) { s.gradient = gradientForArtist(s.label); return s; }));
      });
    }

    var current  = 0;
    var audio    = document.getElementById('audio');
    var progress = document.getElementById('progress');
    var btnPlay  = document.getElementById('btn-play');
    var titleEl  = document.getElementById('player-title');
    var coverEl  = document.getElementById('player-cover');

    function loadSong(index, autoplay) {
      current = index;
      var song = playlist[index];
      audio.src = song.src;
      titleEl.textContent = song.title;
      coverEl.querySelector('span').textContent = song.label;
      coverEl.style.background = song.gradient;
      progress.value = 0;
      paintProgress(0);
      if (autoplay) {
        var playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.then(function () {
            setPlayIcon(true);
          }).catch(function () {
            setPlayIcon(false);
          });
        } else {
          setPlayIcon(true);
        }
      } else {
        setPlayIcon(false);
      }
    }

    function paintProgress(v) {
      progress.style.background =
        'linear-gradient(to right, #c9b8a0 ' + v + '%, rgba(255,255,255,0.25) ' + v + '%)';
    }

    function setPlayIcon(playing) {
      btnPlay.innerHTML = playing ? '&#x23F8;' : '&#x25B6;';
    }

    function initPlayer() {
      var startIndex = parseInt(localStorage.getItem('startSong'));
      localStorage.removeItem('startSong');
      loadSong(isNaN(startIndex) ? 0 : startIndex, !isNaN(startIndex));

      audio.volume = 0.8;

      audio.addEventListener('timeupdate', function () {
        if (audio.duration && isFinite(audio.duration)) {
          var pct = (audio.currentTime / audio.duration) * 100;
          progress.value = pct;
          paintProgress(pct);
        }
      });

      audio.addEventListener('ended', function () {
        nextSong();
      });
    }

    initPlaylist().then(initPlayer).catch(function () {
      initPlayer();
    });

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        setPlayIcon(true);
      } else {
        audio.pause();
        setPlayIcon(false);
      }
    }

    function nextSong() {
      var next;
      if (document.getElementById('btn-shuffle').classList.contains('active')) {
        next = Math.floor(Math.random() * playlist.length);
      } else {
        next = (current + 1) % playlist.length;
      }
      loadSong(next, true);
    }

    function prevSong() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        var prev = (current - 1 + playlist.length) % playlist.length;
        loadSong(prev, !audio.paused);
      }
    }

    function seek(input) {
      if (audio.duration && isFinite(audio.duration)) {
        audio.currentTime = (input.value / 100) * audio.duration;
        paintProgress(input.value);
      }
    }

    function repeatSong() {
      audio.currentTime = 0;
      audio.play();
      setPlayIcon(true);
      var btn = document.getElementById('btn-repeat');
      btn.classList.add('active');
      setTimeout(function () { btn.classList.remove('active'); }, 400);
    }

    function setVolume(input) {
      var v = input.value / 100;
      audio.volume = v;
      var icon = document.getElementById('volume-icon');
      if (v === 0)       icon.innerHTML = '&#x2715;';
      else if (v < 0.4)  icon.innerHTML = '&#x25B2;';
      else if (v < 0.7)  icon.innerHTML = '&#x25B2;&#x25B2;';
      else               icon.innerHTML = '&#x25B2;&#x25B2;&#x25B2;';
      paintVolume(input.value);
    }

    function paintVolume(v) {
      document.getElementById('volume').style.background =
        'linear-gradient(to right, #c9b8a0 ' + v + '%, rgba(255,255,255,0.25) ' + v + '%)';
    }

    paintVolume(80);

    function toggleShuffle() {
      document.getElementById('btn-shuffle').classList.toggle('active');
    }
  </script>

</body>
</html>
