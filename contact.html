<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Contactens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="topbar">RadioLofi</div>
  <div id="main">
    <div id="content">
      <h2>Contactens:</h2>

      <p class="contact-intro">
        Tens alguna suggèrencia, pregunta o simplement vols dir hola? Omple el formulari i t'intentarem respondre el més aviat possible.
      </p>

      <form class="contact-form" action="contact.html" method="get">

        <div class="form-group">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" placeholder="El teu nom..." required />
        </div>

        <div class="form-group">
          <label for="correu">Correu electrònic</label>
          <input type="email" id="correu" name="correu" placeholder="exemple@correu.com" required />
        </div>

        <div class="form-group">
          <label for="missatge">Missatge</label>
          <textarea id="missatge" name="missatge" rows="6" placeholder="Escriu aquí el teu missatge..." required></textarea>
        </div>

        <button type="submit" class="form-btn">Enviar missatge</button>

      </form>
    </div>

    <div id="sidebar">
      <nav>
        <a href="index.html">Index</a>
        <a href="main.html">Radio</a>
        <a href="contact.html" class="active">Contactens</a>
        <a href="about.html">Sobre Nosaltres</a>
      </nav>
    </div>
  </div>
</body>
</html>
